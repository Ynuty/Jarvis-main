[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "Локальный ассистент: список дел из переписки в Telegram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
# Живое подключение к аккаунту Telegram (только чтение)
telegram = ["telethon>=1.36"]
# Хранение сессии и ключей в хранилище учётных данных Windows
secure = ["keyring>=24"]
dev = ["pytest>=8"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
